<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password – CareerPulse</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-purple: #7C3AED;
            --primary-purple-hover: #6D28D9;
            --purple-light: #F5F3FF;
            --purple-subtle: #EDE9FE;
            --purple-border: #DDD6FE;
            --text-dark: #1F2937;
            --text-muted: #6B7280;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #F5F3FF 0%, #EDE9FE 50%, #F8F9FD 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            color: var(--text-dark);
        }

        .auth-card {
            background: #FFFFFF;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(124, 58, 237, 0.12), 0 1px 3px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(221, 214, 254, 0.6);
            width: 100%;
            max-width: 480px;
            overflow: hidden;
        }

        .auth-header {
            padding: 2.25rem 2.25rem 1.25rem 2.25rem;
            text-align: center;
        }

        .brand-badge-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #7C3AED 0%, #5B21B6 100%);
            color: white;
            border-radius: 16px;
            font-size: 1.6rem;
            box-shadow: 0 8px 16px rgba(124, 58, 237, 0.25);
            margin-bottom: 1rem;
        }

        .auth-body {
            padding: 0 2.25rem 2.25rem 2.25rem;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.875rem;
            color: #374151;
            margin-bottom: 0.4rem;
        }

        .input-group-text {
            background-color: #F9FAFB;
            border-color: #E5E7EB;
            color: #9CA3AF;
        }

        .form-control {
            border-color: #E5E7EB;
            padding: 0.7rem 0.95rem;
            font-size: 0.925rem;
            border-radius: 10px;
        }

        .form-control:focus {
            border-color: var(--primary-purple);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
        }

        .btn-purple-primary {
            background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 100%);
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(124, 58, 237, 0.25);
        }

        .btn-purple-primary:hover {
            background: linear-gradient(135deg, #6D28D9 0%, #5B21B6 100%);
            color: white;
            transform: translateY(-1px);
        }

        .strength-bar {
            height: 4px;
            border-radius: 2px;
            transition: all 0.3s ease;
            background-color: #E5E7EB;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="auth-header">
        <div class="brand-badge-box">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h4 class="fw-bold mb-1" style="color: #1E1B4B;">Create New Password</h4>
        <p class="text-muted small mb-0">Choose a strong new password for your account</p>
    </div>

    <div class="auth-body">
        <!-- Error Banner -->
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center py-2 px-3 small rounded-3 mb-3" role="alert">
            <i class="bi bi-exclamation-circle-fill me-2 fs-6"></i>
            <span th:text="${errorMessage}">Error message</span>
            <button type="button" class="btn-close ms-auto p-2" data-bs-dismiss="alert"></button>
        </div>

        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" name="token" th:value="${token}">

            <div class="mb-3">
                <label for="password" class="form-label">New Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="At least 6 characters" required autofocus>
                    <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn" style="border-color: #E5E7EB;">
                        <i class="bi bi-eye" id="toggleEyeIcon"></i>
                    </button>
                </div>
                <div class="strength-bar mt-2" id="strengthBar"></div>
            </div>

            <div class="mb-4">
                <label for="confirmPassword" class="form-label">Confirm New Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Confirm your new password" required>
                </div>
                <div id="matchMessage" class="small mt-1 text-muted"></div>
            </div>

            <button type="submit" class="btn btn-purple-primary w-100 mb-3">
                <i class="bi bi-check2-circle me-2"></i> Update Password & Sign In
            </button>
        </form>

        <div class="text-center pt-2 border-top">
            <a th:href="@{/login}" class="fw-semibold text-decoration-none small" style="color: var(--primary-purple);">
                <i class="bi bi-arrow-left me-1"></i> Back to Sign In
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    const toggleEyeIcon = document.getElementById('toggleEyeIcon');

    if (togglePasswordBtn) {
        togglePasswordBtn.addEventListener('click', function() {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            toggleEyeIcon.classList.toggle('bi-eye');
            toggleEyeIcon.classList.toggle('bi-eye-slash');
        });
    }

    const strengthBar = document.getElementById('strengthBar');
    passwordInput.addEventListener('input', function() {
        const val = passwordInput.value;
        let score = 0;
        if (val.length >= 6) score++;
        if (val.length >= 8) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val) || /[^A-Za-z0-9]/.test(val)) score++;

        if (val.length === 0) {
            strengthBar.style.backgroundColor = '#E5E7EB';
            strengthBar.style.width = '0%';
        } else if (score <= 1) {
            strengthBar.style.backgroundColor = '#EF4444';
            strengthBar.style.width = '25%';
        } else if (score === 2) {
            strengthBar.style.backgroundColor = '#F59E0B';
            strengthBar.style.width = '50%';
        } else if (score === 3) {
            strengthBar.style.backgroundColor = '#10B981';
            strengthBar.style.width = '75%';
        } else {
            strengthBar.style.backgroundColor = '#7C3AED';
            strengthBar.style.width = '100%';
        }
        checkMatch();
    });

    const confirmInput = document.getElementById('confirmPassword');
    const matchMessage = document.getElementById('matchMessage');
    function checkMatch() {
        if (!confirmInput.value) {
            matchMessage.textContent = '';
            return;
        }
        if (passwordInput.value === confirmInput.value) {
            matchMessage.textContent = '✓ Passwords match';
            matchMessage.className = 'small mt-1 text-success fw-semibold';
        } else {
            matchMessage.textContent = '✗ Passwords do not match';
            matchMessage.className = 'small mt-1 text-danger';
        }
    }
    confirmInput.addEventListener('input', checkMatch);
</script>
</body>
</html>
