<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account – CareerPulse</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-purple: #7C3AED;
            --primary-purple-hover: #6D28D9;
            --purple-light: #F5F3FF;
            --purple-subtle: #EDE9FE;
            --purple-border: #DDD6FE;
            --text-dark: #1F2937;
            --text-muted: #6B7280;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #F5F3FF 0%, #EDE9FE 50%, #F8F9FD 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1rem;
            color: var(--text-dark);
        }

        .auth-card {
            background: #FFFFFF;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(124, 58, 237, 0.12), 0 1px 3px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(221, 214, 254, 0.6);
            width: 100%;
            max-width: 540px;
            overflow: hidden;
        }

        .auth-header {
            padding: 2rem 2.25rem 1.25rem 2.25rem;
            text-align: center;
        }

        .brand-badge-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #7C3AED 0%, #5B21B6 100%);
            color: white;
            border-radius: 14px;
            font-size: 1.5rem;
            box-shadow: 0 8px 16px rgba(124, 58, 237, 0.25);
            margin-bottom: 0.75rem;
        }

        .auth-body {
            padding: 0 2.25rem 2.25rem 2.25rem;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #374151;
            margin-bottom: 0.35rem;
        }

        .input-group-text {
            background-color: #F9FAFB;
            border-color: #E5E7EB;
            color: #9CA3AF;
        }

        .form-control {
            border-color: #E5E7EB;
            padding: 0.65rem 0.85rem;
            font-size: 0.9rem;
            border-radius: 10px;
        }

        .form-control:focus {
            border-color: var(--primary-purple);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
        }

        .btn-purple-primary {
            background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 100%);
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(124, 58, 237, 0.25);
        }

        .btn-purple-primary:hover {
            background: linear-gradient(135deg, #6D28D9 0%, #5B21B6 100%);
            color: white;
            transform: translateY(-1px);
        }

        .strength-bar {
            height: 4px;
            border-radius: 2px;
            transition: all 0.3s ease;
            background-color: #E5E7EB;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="auth-header">
        <div class="brand-badge-box">
            <i class="bi bi-person-plus-fill"></i>
        </div>
        <h4 class="fw-bold mb-1" style="color: #1E1B4B;">Create Account</h4>
        <p class="text-muted small mb-0">Join CareerPulse and manage your job search pipeline</p>
    </div>

    <div class="auth-body">
        <!-- Error Banner -->
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center py-2 px-3 small rounded-3 mb-3" role="alert">
            <i class="bi bi-exclamation-circle-fill me-2 fs-6"></i>
            <span th:text="${errorMessage}">Registration error</span>
            <button type="button" class="btn-close ms-auto p-2" data-bs-dismiss="alert"></button>
        </div>

        <!-- Registration Form -->
        <form th:action="@{/register}" th:object="${user}" method="post" id="registerForm">
            <div class="row g-3">
                <div class="col-12">
                    <label for="fullName" class="form-label">Full Name <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" th:field="*{fullName}" id="fullName" placeholder="e.g. Sahana" required>
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>

                <div class="col-md-7">
                    <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" th:field="*{email}" id="email" placeholder="name@example.com" required>
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="col-md-5">
                    <label for="phone" class="form-label">Phone Number</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                        <input type="text" class="form-control" th:field="*{phone}" id="phone" placeholder="+91 98765 43210">
                    </div>
                </div>

                <div class="col-md-6">
                    <label for="location" class="form-label">Location</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                        <input type="text" class="form-control" th:field="*{location}" id="location" placeholder="Bengaluru, Karnataka">
                    </div>
                </div>

                <div class="col-md-6">
                    <label for="targetRole" class="form-label">Career Interest / Target Role</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-briefcase"></i></span>
                        <input type="text" class="form-control" th:field="*{targetRole}" id="targetRole" placeholder="Java Full Stack Developer">
                    </div>
                </div>

                <div class="col-md-6">
                    <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" th:field="*{password}" id="password" placeholder="At least 6 characters" required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn" style="border-color: #E5E7EB;">
                            <i class="bi bi-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                    <div class="strength-bar mt-2" id="strengthBar"></div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="col-md-6">
                    <label for="confirmPassword" class="form-label">Confirm Password <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                        <input type="password" class="form-control" th:field="*{confirmPassword}" id="confirmPassword" placeholder="Re-enter password" required>
                    </div>
                    <div id="matchMessage" class="small mt-1 text-muted"></div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                </div>
            </div>

            <button type="submit" class="btn btn-purple-primary w-100 mt-4 mb-3" id="submitBtn">
                <i class="bi bi-person-check-fill me-2"></i> Register Account
            </button>
        </form>

        <div class="text-center pt-2 border-top">
            <span class="text-muted small">Already have an account?</span>
            <a th:href="@{/login}" class="fw-bold text-decoration-none ms-1 small" style="color: var(--primary-purple);">
                Sign In
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Password toggle
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('togglePasswordIcon');

    if (togglePasswordBtn) {
        togglePasswordBtn.addEventListener('click', function() {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            toggleIcon.classList.toggle('bi-eye');
            toggleIcon.classList.toggle('bi-eye-slash');
        });
    }

    // Password strength check
    const strengthBar = document.getElementById('strengthBar');
    passwordInput.addEventListener('input', function() {
        const val = passwordInput.value;
        let score = 0;
        if (val.length >= 6) score++;
        if (val.length >= 8) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val) || /[^A-Za-z0-9]/.test(val)) score++;

        if (val.length === 0) {
            strengthBar.style.backgroundColor = '#E5E7EB';
            strengthBar.style.width = '0%';
        } else if (score <= 1) {
            strengthBar.style.backgroundColor = '#EF4444';
            strengthBar.style.width = '25%';
        } else if (score === 2) {
            strengthBar.style.backgroundColor = '#F59E0B';
            strengthBar.style.width = '50%';
        } else if (score === 3) {
            strengthBar.style.backgroundColor = '#10B981';
            strengthBar.style.width = '75%';
        } else {
            strengthBar.style.backgroundColor = '#7C3AED';
            strengthBar.style.width = '100%';
        }
        checkMatch();
    });

    // Password match check
    const confirmInput = document.getElementById('confirmPassword');
    const matchMessage = document.getElementById('matchMessage');
    function checkMatch() {
        if (!confirmInput.value) {
            matchMessage.textContent = '';
            return;
        }
        if (passwordInput.value === confirmInput.value) {
            matchMessage.textContent = '✓ Passwords match';
            matchMessage.className = 'small mt-1 text-success fw-semibold';
        } else {
            matchMessage.textContent = '✗ Passwords do not match';
            matchMessage.className = 'small mt-1 text-danger';
        }
    }
    confirmInput.addEventListener('input', checkMatch);
</script>
</body>
</html>
