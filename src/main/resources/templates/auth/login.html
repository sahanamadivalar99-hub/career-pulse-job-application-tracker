<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – CareerPulse</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-purple: #7C3AED;
            --primary-purple-hover: #6D28D9;
            --purple-light: #F5F3FF;
            --purple-subtle: #EDE9FE;
            --purple-border: #DDD6FE;
            --text-dark: #1F2937;
            --text-muted: #6B7280;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #F5F3FF 0%, #EDE9FE 50%, #F8F9FD 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            color: var(--text-dark);
        }

        .auth-card {
            background: #FFFFFF;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(124, 58, 237, 0.12), 0 1px 3px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(221, 214, 254, 0.6);
            width: 100%;
            max-width: 460px;
            overflow: hidden;
        }

        .auth-header {
            padding: 2.25rem 2.25rem 1.25rem 2.25rem;
            text-align: center;
        }

        .brand-badge-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #7C3AED 0%, #5B21B6 100%);
            color: white;
            border-radius: 16px;
            font-size: 1.6rem;
            box-shadow: 0 8px 16px rgba(124, 58, 237, 0.25);
            margin-bottom: 1rem;
        }

        .auth-body {
            padding: 0 2.25rem 2.25rem 2.25rem;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.875rem;
            color: #374151;
            margin-bottom: 0.4rem;
        }

        .input-group-text {
            background-color: #F9FAFB;
            border-color: #E5E7EB;
            color: #9CA3AF;
        }

        .form-control {
            border-color: #E5E7EB;
            padding: 0.7rem 0.95rem;
            font-size: 0.925rem;
            border-radius: 10px;
        }

        .form-control:focus {
            border-color: var(--primary-purple);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
        }

        .btn-purple-primary {
            background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 100%);
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(124, 58, 237, 0.25);
        }

        .btn-purple-primary:hover {
            background: linear-gradient(135deg, #6D28D9 0%, #5B21B6 100%);
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(124, 58, 237, 0.35);
        }

        .demo-credential-box {
            background-color: var(--purple-light);
            border: 1px dashed var(--purple-border);
            border-radius: 12px;
            padding: 0.9rem;
            font-size: 0.825rem;
            margin-bottom: 1.5rem;
        }

        .demo-badge {
            background-color: var(--purple-subtle);
            color: var(--primary-purple);
            font-weight: 700;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            font-size: 0.725rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="auth-header">
        <div class="brand-badge-box">
            <i class="bi bi-briefcase-fill"></i>
        </div>
        <h4 class="fw-bold mb-1" style="color: #1E1B4B;">CareerPulse</h4>
        <p class="text-muted small mb-0">Smart Job Application Tracker & AI Resume Analyzer</p>
    </div>

    <div class="auth-body">
        <!-- Error Banner -->
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center py-2 px-3 small rounded-3 mb-3" role="alert">
            <i class="bi bi-exclamation-circle-fill me-2 fs-6"></i>
            <span th:text="${errorMessage}">Invalid credentials.</span>
            <button type="button" class="btn-close ms-auto p-2" data-bs-dismiss="alert"></button>
        </div>

        <!-- Success Banner -->
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show d-flex align-items-center py-2 px-3 small rounded-3 mb-3" role="alert">
            <i class="bi bi-check-circle-fill me-2 fs-6"></i>
            <span th:text="${successMessage}">Action completed.</span>
            <button type="button" class="btn-close ms-auto p-2" data-bs-dismiss="alert"></button>
        </div>

        <!-- Demo Account Banner -->
        <div class="demo-credential-box d-flex align-items-start gap-2">
            <i class="bi bi-info-circle-fill text-purple fs-5 mt-1" style="color: var(--primary-purple);"></i>
            <div class="w-100">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <span class="fw-bold text-dark">Default Demo Account</span>
                    <span class="demo-badge">Bengaluru Candidate</span>
                </div>
                <div class="text-muted" style="line-height: 1.4;">
                    Email: <code class="text-dark fw-bold">sahana.bengaluru@example.com</code><br>
                    Password: <code class="text-dark fw-bold">Sahana@123</code>
                </div>
                <button type="button" id="fillDemoBtn" class="btn btn-sm btn-link p-0 text-decoration-none mt-1 fw-semibold" style="color: var(--primary-purple); font-size: 0.8rem;">
                    <i class="bi bi-magic me-1"></i> Auto-fill demo credentials
                </button>
            </div>
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label">Email Address or Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="text" class="form-control" id="email" name="email" placeholder="name@example.com" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label for="password" class="form-label mb-0">Password</label>
                    <a th:href="@{/forgot-password}" class="text-decoration-none small fw-semibold" style="color: var(--primary-purple);">Forgot Password?</a>
                </div>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                    <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn" style="border-color: #E5E7EB;">
                        <i class="bi bi-eye" id="toggleEyeIcon"></i>
                    </button>
                </div>
            </div>

            <div class="d-flex align-items-center justify-content-between mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe" name="remember-me" checked>
                    <label class="form-check-label small text-muted" for="rememberMe">
                        Remember me for 14 days
                    </label>
                </div>
            </div>

            <button type="submit" class="btn btn-purple-primary w-100 mb-3">
                <i class="bi bi-box-arrow-in-right me-2"></i> Sign In to Dashboard
            </button>
        </form>

        <div class="text-center pt-2 border-top">
            <span class="text-muted small">Don't have an account?</span>
            <a th:href="@{/register}" class="fw-bold text-decoration-none ms-1 small" style="color: var(--primary-purple);">
                Create Account
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Password toggle
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    const toggleEyeIcon = document.getElementById('toggleEyeIcon');

    if (togglePasswordBtn) {
        togglePasswordBtn.addEventListener('click', function() {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            toggleEyeIcon.classList.toggle('bi-eye');
            toggleEyeIcon.classList.toggle('bi-eye-slash');
        });
    }

    // Auto fill demo button
    const fillDemoBtn = document.getElementById('fillDemoBtn');
    if (fillDemoBtn) {
        fillDemoBtn.addEventListener('click', function() {
            document.getElementById('email').value = 'sahana.bengaluru@example.com';
            document.getElementById('password').value = 'Sahana@123';
        });
    }
</script>
</body>
</html>
