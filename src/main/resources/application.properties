# ==============================================================
# Smart Job Application Tracker with AI Resume Analyzer
# Application Configuration
# ==============================================================

spring.application.name=Smart Job Application Tracker
server.port=8080

# File Upload Configuration (Supports PDFs up to 15MB)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.enabled=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Default Database: File-based persistence (H2 default, overridable via environment variables for PostgreSQL/MySQL cloud deployment)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/jobtrackerdb;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA & Hibernate Settings (dialect auto-detected by Hibernate 6 for H2, PostgreSQL & MySQL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
# Disable auto script initialization (Hibernate manages schema DDL automatically)
spring.sql.init.mode=never

# Google OAuth2 Client Configuration with safe environment variable fallbacks
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile

# Disable DevTools restart to prevent race conditions during boot
spring.devtools.restart.enabled=false

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# AI / Gemini API Key (Optional: set here or enter via Web Settings page)
gemini.api.key=

# Logging
logging.level.com.tracker=INFO
logging.level.org.springframework.web=INFO
