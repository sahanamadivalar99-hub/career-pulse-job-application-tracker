# Test Configuration - In-Memory Database for fast, isolated test execution
spring.application.name=Smart Job Application Tracker Test
spring.profiles.active=dev
spring.datasource.url=jdbc:h2:mem:jobtrackertestdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.thymeleaf.cache=false
gemini.api.key=

# Safe Mock Google OAuth2 Client Configuration for test context
spring.security.oauth2.client.registration.google.client-id=mock-google-client-id
spring.security.oauth2.client.registration.google.client-secret=mock-google-client-secret
spring.security.oauth2.client.registration.google.scope=email,profile
